<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clone-requests</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <strong>clone-requests</strong>
        <span id="tab-label" class="muted">Nenhuma aba</span>
      </div>
      <div class="top-actions">
        <button id="record-btn" type="button" class="record">Gravar</button>
      </div>
    </header>

    <p id="status" class="status" hidden></p>

    <section class="filters">
      <button id="filters-toggle" type="button" class="linkish">
        Filtros <span id="filter-count">(0)</span>
      </button>
      <div id="filters-panel" class="filters-panel" hidden>
        <p id="filter-hint" class="hint">
          Nenhum filtro ativo. Sem filtro, nada é gravado.
        </p>
        <form id="filter-form" class="row">
          <input
            id="filter-input"
            type="text"
            placeholder="https://api.exemplo.com/*"
            autocomplete="off"
          />
          <button type="submit">Adicionar</button>
        </form>
        <p id="filter-example" class="filter-example">
          Exemplo:
          <button type="button" id="filter-example-btn" class="filter-example-btn">
            <code>https://api.exemplo.com/*</code>
          </button>
        </p>
        <ul id="filter-list" class="filter-list"></ul>
      </div>
    </section>

    <section class="search">
      <label id="view-filter-wrap" class="view-filter" hidden>
        <span>Ver</span>
        <select id="view-filter" aria-label="Filtrar lista por domínio">
          <option value="">Todos</option>
        </select>
      </label>
      <input
        id="search-input"
        type="search"
        placeholder="Buscar URL, método, status, headers ou body"
      />
      <div class="chips" id="method-chips" aria-label="Filtrar por método">
        <button type="button" class="chip" data-method="GET">GET</button>
        <button type="button" class="chip" data-method="POST">POST</button>
        <button type="button" class="chip" data-method="PUT">PUT</button>
        <button type="button" class="chip" data-method="PATCH">PATCH</button>
        <button type="button" class="chip" data-method="DELETE">DELETE</button>
      </div>
      <div class="chips" id="status-chips" aria-label="Filtrar por status">
        <button type="button" class="chip" data-status="2xx">2xx</button>
        <button type="button" class="chip" data-status="4xx">4xx</button>
        <button type="button" class="chip" data-status="5xx">5xx</button>
      </div>
    </section>

    <section class="layout">
      <ul id="request-list" class="request-list"></ul>
    </section>

    <footer class="footer">
      <button id="export-all-btn" type="button" disabled>Exportar todos</button>
      <button id="clear-btn" type="button" class="danger ghost">Limpar histórico</button>
    </footer>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
