<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clone-requests</title>
    <link rel="stylesheet" href="../../../entrypoints/ui/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <strong>clone-requests</strong>
        <span class="muted">clone-requests — página de teste</span>
      </div>
      <div class="top-actions">
        <button type="button" class="ghost" title="Abrir em aba" aria-label="Abrir em aba">
          Abrir em aba
        </button>
        <button type="button" class="record">Gravar</button>
      </div>
    </header>

    <section class="filters">
      <button type="button" class="linkish">Filtros <span>(0)</span></button>
      <div class="filters-panel">
        <p class="hint">
          Nenhum filtro ativo. Sem filtro, nada é gravado.
        </p>
        <form class="row">
          <input
            type="text"
            placeholder="https://api.exemplo.com/*"
            autocomplete="off"
          />
          <button type="button">Adicionar</button>
        </form>
        <p class="filter-example">
          Exemplo:
          <button type="button" class="filter-example-btn">
            <code>https://api.exemplo.com/*</code>
          </button>
        </p>
        <ul class="filter-list"></ul>
      </div>
    </section>

    <section class="search">
      <input type="search" placeholder="Buscar URL, método, status, headers ou body" />
      <div class="chips" aria-label="Filtrar por método">
        <button type="button" class="chip">GET</button>
        <button type="button" class="chip">POST</button>
        <button type="button" class="chip">PUT</button>
        <button type="button" class="chip">PATCH</button>
        <button type="button" class="chip">DELETE</button>
      </div>
      <div class="chips" aria-label="Filtrar por status">
        <button type="button" class="chip">2xx</button>
        <button type="button" class="chip">4xx</button>
        <button type="button" class="chip">5xx</button>
      </div>
    </section>

    <section class="layout">
      <ul class="request-list">
        <li class="empty-row">
          Nenhuma requisição clonada ainda.
        </li>
      </ul>
    </section>

    <footer class="footer">
      <button type="button" disabled>Exportar todos</button>
      <button type="button" class="danger ghost">Limpar histórico</button>
    </footer>
  </body>
</html>
